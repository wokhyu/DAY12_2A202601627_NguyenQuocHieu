name: CI

# Chạy cả trên pull_request chứ không chỉ push: bắt lỗi TRƯỚC khi code vào
# nhánh chính mới là mục đích chính của CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Ghim phiên bản (@v4) thay vì @main: @main nghĩa là mỗi lần chạy đều
      # thực thi bản mới nhất của code người khác.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: pip install -r requirements.txt

      - name: Chạy test checkpoint
        # Máy CI không có file .env, mà Settings bắt buộc có AGENT_API_KEY.
        # Truyền giá trị giả qua biến môi trường — đúng tinh thần 12-Factor:
        # cùng một code, môi trường khác nhau chỉ khác biến môi trường.
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        # Loại test_cp5.py (cần một bản deploy đang sống) và
        # test_bonus_cicd.py (kiểm tra badge của chính workflow này — tự tham
        # chiếu vòng tròn). -m "not docker" bỏ qua test build image vì job
        # `build` bên dưới đã build thật rồi.
        run: |
          pytest tests/ -v -m "not docker" \
            --ignore=tests/test_cp5.py \
            --ignore=tests/test_bonus_cicd.py

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build trên máy sạch của GitHub: bắt các lỗi kiểu "file này chỉ có trên
      # máy tôi" hoặc .dockerignore loại nhầm thứ image cần.
      - name: Build Docker image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Kiểm tra container không chạy bằng root
        run: |
          whoami=$(docker run --rm day12-agent:${{ github.sha }} id -un)
          echo "container chạy bằng user: $whoami"
          test "$whoami" != "root"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # needs: đợi cả hai job trên xanh. Thiếu dòng này thì các job chạy song
    # song và code hỏng vẫn lên production trong khi test đang đỏ.
    needs: [test, build]
    # if: không có nó thì mỗi lần ai đó mở pull request là một lần deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Deploy Hook là một URL bí mật, gọi vào là Render deploy commit mới nhất.
      # Nó nằm trong Settings → Secrets, không nằm trong file này.
      - name: Gọi Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # Deploy xong mà không kiểm tra thì chỉ biết "lệnh deploy chạy xong",
      # không biết "service còn sống". curl -f trả mã lỗi khi HTTP không phải
      # 2xx nên job đỏ ngay.
      - name: Smoke test
        run: |
          sleep 90
          curl -fsS "${{ vars.PUBLIC_URL }}/health"
          curl -fsS "${{ vars.PUBLIC_URL }}/ready"
